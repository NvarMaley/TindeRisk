name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==9.2.0 PyYAML==6.0.2
      - name: Start the profile app when available
        if: ${{ hashFiles('streamlit_app.py') != '' }}
        run: |
          python -m pip install -r requirements-app.txt playwright==1.65.2
          python -m playwright install --with-deps chromium
          python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 > "$RUNNER_TEMP/riskmatch.log" 2>&1 &
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8501/_stcore/health
          echo "RISKMATCH_APP_URL=http://localhost:8501" >> "$GITHUB_ENV"
      - run: python -m pytest -q
