name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-forecast.txt
      - run: python -m pip install -r requirements-risk.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: pytest
      - run: python scripts/check_notebooks.py
      - run: python scripts/execute_notebook.py
      - run: python scripts/check_git_exclusions.py
      - run: python scripts/check_checklist.py
      - run: python scripts/task_dependencies.py --check
      - run: node --test tests/web/*.test.cjs
