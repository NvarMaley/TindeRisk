name: Course examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /RiskMatch.ipynb
            /research/check_source_fixture.py
            /data/demo/source_events_v1.json
            /tests/
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -I -S tests/check_course_examples.py
      - run: python -I -S research/check_source_fixture.py
  intake:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-app.txt
            /app/
            /src/
            /questions/profile_v1.json
            /data/demo/monitor_feed.json
            /research/catalogue/
            /questions/pilot_holdout_v1.json
            /research/questionnaire_pilot.py
            /research/options/results/
            /research/simulate_interview.py
            /tests/
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-app.txt
      - run: python -m unittest discover -s tests -p 'test_intake*.py'
      - run: python tests/test_options_app.py
      - run: python tests/test_interview.py
      - run: python tests/test_questionnaire_pilot.py

  cleaning:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-data.txt
            /research/cleaning/
            /tests/test_cleaning.py
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-data.txt
      - run: python tests/test_cleaning.py

  descriptive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-descriptive.txt
            /research/descriptive/*.py
            /tests/test_descriptive.py
            /research/shocks/
            /tests/test_shocks.py
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-descriptive.txt
      - run: python tests/test_descriptive.py
      - run: python tests/test_shocks.py

  experiments:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-descriptive.txt
            /requirements-experiments.txt
            /research/experiments/
            /tests/test_experiments.py
            /research/robustness/
            /tests/test_signal_robustness.py
            /research/sentiment_followup/
            /research/course_replay.py
            /tests/test_sentiment_followup.py
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-experiments.txt
      - run: python tests/test_experiments.py
      - run: python tests/test_sentiment_followup.py
      - run: python tests/test_signal_robustness.py

  frontier:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-frontier.txt
            /requirements-descriptive.txt
            /research/frontier/
            /src/riskmatch/
            /questions/profile_v1.json
            /research/options/
            /tests/test_client_options.py
            /tests/test_frontier.py
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-frontier.txt
      - run: python tests/test_frontier.py
      - run: python tests/test_client_options.py

  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.python-version
            /requirements-app.txt
            /requirements-descriptive.txt
            /requirements-frontier.txt
            /app/
            /src/
            /questions/profile_v1.json
            /data/demo/monitor_feed.json
            /data/demo/source_events_v1.json
            /research/check_source_fixture.py
            /research/release/
            /research/catalogue/
            /research/options/*.py
            /research/frontier/*.py
            /research/execution/*.py
            /tests/test_catalogue_gate.py
            /tests/test_execution_replay.py
            /tests/test_monitor*.py
            /tests/test_release_acceptance.py
            /research/frontier/results/latest.csv
            /research/options/results/goal_scenarios.csv
            /research/options/results/reverse_stress.csv
            /research/execution/results/cohorts.csv
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-frontier.txt -r requirements-app.txt
      - run: python -m unittest discover -s tests
      - run: python research/release/verify_package.py
      - run: python research/release/verify_pitch.py
