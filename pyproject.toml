[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riskmatch-v2"
version = "0.1.0"
description = "Standalone research toolkit for RiskMatch V2"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
riskmatch-v2 = "riskmatch_v2.__main__:main"

[project.optional-dependencies]
forecast = ["arch==8.0.0", "beautifulsoup4==4.13.4"]
environment = ["python-calamine==0.4.0"]
faisabilite = ["cvxpy==1.8.2", "clarabel==0.11.1", "scikit-learn==1.6.1", "psutil==7.2.2"]
catalogue = ["requests==2.32.3", "numpy==2.2.5", "pandas==2.2.3", "pyarrow==26.0.1", "duckdb==1.4.2", "openpyxl==3.1.5", "exchange-calendars==4.11.3", "scipy==1.15.2"]
questionnaire = ["streamlit==1.50.0", "plotly==6.0.1"]
notebook = ["pandas==2.2.3", "nbconvert==7.17.0", "ipykernel==6.29.5", "nbclient==0.10.2", "matplotlib==3.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskmatch_v2 = ["demo/*.csv", "questionnaire/*.json"]

"riskmatch_v2.library" = ["equities.sql"]
