[build-system]
requires = ["setuptools==80.3.0"]
build-backend = "setuptools.build_meta"
[project]
name = "riskmatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.5", "scipy==1.15.2"]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]
research = ["duckdb==2.0.1", "jupyterlab==4.5.6", "pandas==2.2.3", "nbformat==5.10.4", "httpx[socks]==0.28.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
