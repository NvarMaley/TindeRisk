# Shared project configuration. Make changes here rather than in the code.
project_name: RiskMatch
python_version: "3.12"
seed: 42
start_date: "2005-01-01"
benchmark: SPY
currency: USD
reference_sharpe: 0.35  # Fixed profiling assumption; see docs/14_REFERENCE_SHARPE.md
transaction_cost_bps: [0, 10, 25]
target_volatility_grid: [0.05, 0.08, 0.10, 0.14]

# Client-facing categories. The continuous score remains available for audit,
# but the application recommends a band and uses its reference volatility.
risk_bands:
  conservative:
    label: Conservative
    min_volatility: 0.04
    max_volatility: 0.06
    reference_volatility: 0.05
  balanced:
    label: Balanced
    min_volatility: 0.06
    max_volatility: 0.09
    reference_volatility: 0.08
  growth:
    label: Growth
    min_volatility: 0.09
    max_volatility: 0.12
    reference_volatility: 0.10
  aggressive:
    label: Aggressive
    min_volatility: 0.12
    max_volatility: 0.15
    reference_volatility: 0.14

client_display:
  summary_metrics:
    - historical_annualized_return_net
    - realized_volatility
    - net_sharpe
    - max_drawdown
    - annualized_cost
  detail_metrics:
    - sortino
    - calmar
    - expected_shortfall_95
    - turnover
    - concentration
    - realized_vs_reference_volatility
  comparison_period: common
  show_net_of_costs_first: true
  label_historical_results_as_non_forecasts: true

scope:
  core_strategies: [classic, erc, black_litterman, benchmark_60_40]
  extensions: [adaptive_questionnaire, regime_budgeting, fomc_nlp, monte_carlo]

portfolio:
  rebalance_frequency: monthly
  estimation_window_years: 3
  long_only: true
  leverage_limit: 1.5          # approved by the professor (DR-03)
  borrowing_spread_bps: 100    # cost of borrowed amount = DTB3 + spread (DR-03)
  max_weight_per_asset: 0.35

# Step 2.3: implement Raf's shrinkage rule, not a winner selected on future returns.
expected_returns:
  method: regularized_bayes_stein
  target: gmv_mean
  covariance: lw_constcorr
  units: annualized_excess_arithmetic
  status: implementation_default_not_final_oos_validated

validation:
  method: walk_forward
  final_test_start: null  # to be decided before the final evaluation
  periods:                # DR-04 — freeze exact dates before the final comparison
    main:
      start: "2010-01-01"
      end: "2020-03-31"     # end of StockTwits coverage
      strategies: [classic, erc, black_litterman, benchmark_60_40]
    extended:
      start: "2009-01-01"
      end: null             # latest available date
      strategies: [classic, erc, black_litterman, benchmark_60_40]
      note: "BL reverts to its ERC anchor when no sentiment views exist (after 2020-03)"
  primary_metrics:
    - realized_vs_target_volatility
    - net_sharpe
    - max_drawdown
  transaction_cost_bps_main: 10

tickers:
  sectors: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU]
  diversifiers: [IEF, TLT, GLD]

black_litterman:            # DR-02
  anchor: erc               # x0; optimality justified (Maillard, Roncalli & Teiletche, 2010)
  anchor_sensitivity: [benchmark_60_40]

sentiment:                  # DR-01
  core_dataset: moodle_ln7      # 19 tickers, aggregated daily sentiment, 2010 - 2020-03
  upgrade_dataset: raw_stocktwits  # ~90M messages, via USB key from the professor
  coverage_end: "2020-03-31"
  publish_derived: true         # sector-level series only; raw messages never committed

fred_series:
  risk_free: DTB3
  macro: [T10Y2Y, BAA10Y, VIXCLS, CPIAUCSL, UNRATE, INDPRO]
